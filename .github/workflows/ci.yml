name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify extension
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build Chromium and Firefox
        run: npm run build

      - name: Lint Firefox manifest
        run: npm run lint:firefox

      - name: Evaluate clustering quality
        run: npm run evaluate:check

      - name: Package extensions
        run: npm run package

      - name: Upload extension artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tab-archaeologist-zips
          path: web-ext-artifacts/*.zip
          if-no-files-found: error
          retention-days: 14
